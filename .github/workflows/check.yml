name: JavaScript syntax
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check emby-autoskip.js
      - run: node --check emby-autoskip-sync.js
